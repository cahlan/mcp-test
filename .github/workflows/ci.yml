# CI for mcp-test itself — builds, runs unit tests, and tests against official MCP servers
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci
      - run: npm run build
      - run: npm test

  compliance:
    name: Test vs Official Servers
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npm run build

      - name: Test against @modelcontextprotocol/server-everything
        run: node dist/index.js run --server "npx -y @modelcontextprotocol/server-everything" --output tap --fail-on critical
        continue-on-error: false

      - name: Test against @modelcontextprotocol/server-memory
        run: node dist/index.js run --server "npx -y @modelcontextprotocol/server-memory" --output tap --fail-on critical
        continue-on-error: true
